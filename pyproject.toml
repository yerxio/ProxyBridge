[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxybridge"
version = "0.1.0"
description = "Bridge authenticated HTTP proxies to a local unauthenticated HTTP proxy"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
proxybridge = "proxybridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
